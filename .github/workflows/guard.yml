name: Guard & CI

on:
  push:
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install
      - name: Check active slice
        run: node tools/spec/check-active-slice.mjs || true
      - name: Verify scope guard
        env:
          VERIFY_MODE: ci
        run: node tools/spec/verify-active-slice.mjs
      - name: Commit message lint
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          BASE="$BASE_SHA"
          # A new branch reports an all-zero "before" sha rather than an empty one.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-list --max-parents=0 HEAD | head -n 1)
          fi
          node tools/spec/verify-commit-range.mjs --base "$BASE" --head "$HEAD_SHA"
      - name: Lint
        run: npm run lint -w web
      # Must precede Typecheck. next-env.d.ts is gitignored and carries the
      # ambient declarations for SVG imports, so on a clean checkout tsc cannot
      # resolve them until a build regenerates it. Also the only place CI
      # verifies the production build at all.
      - name: Build web app
        run: npm run build -w web
      - name: Typecheck
        run: npm run typecheck -w web
      - name: Run web unit tests
        run: npm run test:unit -w web
      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run web contract tests
        run: npm run test -w web
      - name: Validate references
        run: npm run spec:validate-references
      - name: Generate progress & index
        run: |
          node tools/spec/progress.mjs || true
          node tools/spec/slice-index.mjs || true

  deploy-web:
    needs: guard
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install
      - name: Build web app for production
        run: npm run deploy
      - name: Deploy to Vercel (production)
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel --prod --token "$VERCEL_TOKEN" --yes
