name: Guard & CI

on:
  push:
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install
      - name: Check active slice
        run: node tools/spec/check-active-slice.mjs || true
      - name: Verify scope guard
        env:
          VERIFY_MODE: ci
        run: node tools/spec/verify-active-slice.mjs
      - name: Commit message lint
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          BASE="$BASE_SHA"
          # A new branch reports an all-zero "before" sha rather than an empty
          # one, and a force-push can report a "before" that no ref reaches any
          # more, so the checkout never fetched it. Falling back to the root
          # commit linted the entire history, and the legacy commits that
          # predate the convention turned every first push of a branch red.
          # Whenever the reported base is unusable, lint what is new to the
          # branch relative to main instead.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git fetch --no-tags origin main
            BASE=$(git merge-base HEAD origin/main)
          fi
          node tools/spec/verify-commit-range.mjs --base "$BASE" --head "$HEAD_SHA"
      - name: Lint
        run: npm run lint -w web
      # Must precede Typecheck. next-env.d.ts is gitignored and carries the
      # ambient declarations for SVG imports, so on a clean checkout tsc cannot
      # resolve them until a build regenerates it. Also the only place CI
      # verifies the production build at all.
      - name: Build web app
        run: npm run build -w web
      - name: Typecheck
        run: npm run typecheck -w web
      - name: Run web unit tests
        run: npm run test:unit -w web
      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run web contract tests
        run: npm run test -w web
      - name: Validate references
        run: npm run spec:validate-references
      - name: Generate progress & index
        run: |
          node tools/spec/progress.mjs || true
          node tools/spec/slice-index.mjs || true

  # There is deliberately no deploy job in this workflow. Merging to main IS
  # the production release: the AWS Amplify app "finspeed" (d2h8tz7elv2xy8,
  # ap-south-1) is connected to main with auto-build and serves
  # https://www.finspeed.online. Branch protection on main requires a pull
  # request and a green "guard" check (admins included), so nothing reaches
  # production without this workflow passing first. A second deploy path here
  # would either double-deploy or drift from Amplify. Verification, rollback,
  # and history: specs/runbooks/repo/release.md (REPO-004).
